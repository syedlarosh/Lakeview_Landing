<!DOCTYPE html>
<html>

<head>
    <title>Full Screen Image with Polygons</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }

        /* Aesthetic Popup Styling - FIXED to not block mouse */
        .custom-popup .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg, #ffffff 0%, #2a5298 100%);
            color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            padding: 0;
            pointer-events: none; /* KEY FIX: Popup mouse ko block nahi karega */
        }
        
        /* But close button needs to be clickable */
        .custom-popup .leaflet-popup-close-button {
            pointer-events: auto;
            cursor: pointer;
        }

        .custom-popup .leaflet-popup-content {
            margin: 0;
            padding: 15px 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-width: 220px;
            pointer-events: none; /* Content bhi mouse ko pass karega */
        }
        
        /* Make the entire popup pass mouse events to the map/polygons behind */
        .custom-popup {
            pointer-events: none !important;
        }
        
        /* But close button still clickable */
        .custom-popup .leaflet-popup-close-button {
            pointer-events: auto !important;
            z-index: 1000;
        }

        .popup-logo {
            display: block;
            margin: 0 auto 10px auto;
            text-align: center;
        }

        .popup-logo img {
            max-width: 300px;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .popup-row {
            display: flex;
            margin: 8px 0;
        }

        .popup-label {
            font-weight: bold;
            width: 70px;
            color: #000000;
        }

        .popup-value {
            flex: 1;
            color: #000000;
        }

        .popup-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 10px 0;
        }

        .close-button {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // Image dimensions
        const IMG_WIDTH = 4289;
        const IMG_HEIGHT = 2250;

        // Logo URL
        const LOGO_URL = "https://static1.squarespace.com/static/646683f1b3ddb256f7b1085f/t/68c314352bdf2d375a2d30f3/1736807703780/";

        // Create map with Simple CRS
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1.5,
            maxZoom: 8,
            zoomSnap: 0.5,
            zoomDelta: 0.5,
            attributionControl: false
        });

        // Image bounds
        var bounds = [[0, 0], [IMG_HEIGHT, IMG_WIDTH]];

        // Add image overlay
        L.imageOverlay('map.jpg', bounds, {
            opacity: 1,
            interactive: true
        }).addTo(map);

        // Force full image visible
        var centerX = IMG_WIDTH / 2;
        var centerY = IMG_HEIGHT / 2;
        map.setView([centerY, centerX], -1.5);
        map.setMaxBounds(bounds);

        // Transformation function
        function transformGeoJSONtoLeaflet(x, y) {
            let newX = x;
            let distanceFromBottom = Math.abs(y);
            let newY = IMG_HEIGHT - distanceFromBottom;
            return [newX, newY];
        }

        // Function to create popup content
        function createPopupContent(props) {
            let blockName = props.BLOCKS || props.block || props.Block || `Block ${props.OBJECTID || ''}`;

            let html = `
                <div class="popup-logo">
                    <img src="${LOGO_URL}" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div class="popup-row">
                    <span class="popup-label">BLOCK:</span>
                    <span class="popup-value">${blockName}</span>
                </div>
            `;

            if (props.LOT || props.Lot || props.lot) {
                let lotVal = props.LOT || props.Lot || props.lot;
                html += `<div class="popup-row"><span class="popup-label">LOT:</span><span class="popup-value">${lotVal}</span></div>`;
            }

            if (props.AREA || props.Area || props.area || props.Shape_Area) {
                let areaVal = props.AREA || props.Area || props.area || props.Shape_Area;
                areaVal = typeof areaVal === 'number' ? areaVal.toFixed(2) : areaVal;
                html += `<div class="popup-row"><span class="popup-label">AREA(SF):</span><span class="popup-value">${areaVal}</span></div>`;
            }

            if (props.PRICE || props.Price || props.price) {
                let priceVal = props.PRICE || props.Price || props.price;
                priceVal = typeof priceVal === 'number' ? priceVal.toLocaleString() : priceVal;
                html += `<div class="popup-row"><span class="popup-label">PRICE:</span><span class="popup-value">${priceVal}</span></div>`;
            }

            let builderVal = props.BUILDER || props.Builder || props.builder;
            if (builderVal && builderVal.toString().trim() !== '') {
                html += `<div class="popup-divider"></div>`;
                html += `<div class="popup-row"><span class="popup-label">BUILDER:</span><span class="popup-value"> ${builderVal}</span></div>`;
            }

            return html;
        }

        // Load GeoJSON
        fetch('data.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error('data.geojson not found!');
                }
                return response.json();
            })
            .then(geojson => {
                console.log("✅ GeoJSON loaded");

                // Transform coordinates
                function transformGeometry(geometry) {
                    if (geometry.type === 'Polygon') {
                        geometry.coordinates = geometry.coordinates.map(ring => {
                            return ring.map(coord => {
                                return transformGeoJSONtoLeaflet(coord[0], coord[1]);
                            });
                        });
                    }
                    else if (geometry.type === 'MultiPolygon') {
                        geometry.coordinates = geometry.coordinates.map(polygon => {
                            return polygon.map(ring => {
                                return ring.map(coord => {
                                    return transformGeoJSONtoLeaflet(coord[0], coord[1]);
                                });
                            });
                        });
                    }
                    return geometry;
                }

                geojson.features.forEach(feature => {
                    if (feature.geometry) {
                        feature.geometry = transformGeometry(feature.geometry);
                    }
                });

                // ========== SOLUTION: Popup mouse ko block nahi karega ==========
                let currentActiveLayer = null;
                
                // Styles
                const invisibleStyle = {
                    color: 'transparent',
                    weight: 0,
                    fillColor: 'transparent',
                    fillOpacity: 0,
                    opacity: 0
                };
                
                const hoverStyle = {
                    color: '#ff0000',
                    weight: 3,
                    fillColor: '#ffaa44',
                    fillOpacity: 0.5,
                    opacity: 1
                };
                
                // Add all polygons
                const geoJsonLayer = L.geoJSON(geojson, {
                    style: invisibleStyle,
                    interactive: true,
                    onEachFeature: function (feature, layer) {
                        let popupContent = createPopupContent(feature.properties);
                        
                        // Bind popup with offset so it doesn't cover the polygon completely
                        layer.bindPopup(popupContent, {
                            className: 'custom-popup',
                            closeButton: true,
                            autoClose: false,
                            closeOnClick: false,
                            offset: [0, -20] // Popup thoda upar rahega
                        });
                        
                        // MOUSE ENTER
                        layer.on('mouseover', function(e) {
                            L.DomEvent.stopPropagation(e);
                            
                            if (currentActiveLayer === layer) return;
                            
                            // Remove previous highlight
                            if (currentActiveLayer) {
                                currentActiveLayer.setStyle(invisibleStyle);
                                currentActiveLayer.closePopup();
                            }
                            
                            // Set new active layer
                            currentActiveLayer = layer;
                            
                            // Apply highlight style
                            layer.setStyle(hoverStyle);
                            layer.bringToFront();
                            
                            // Open popup
                            layer.openPopup();
                        });
                        
                        // MOUSE LEAVE - with check for popup
                        layer.on('mouseout', function(e) {
                            // Check if moving to another layer or popup
                            let toLayer = e.relatedTarget;
                            
                            // Small delay to allow moving to another polygon
                            setTimeout(() => {
                                if (currentActiveLayer === layer) {
                                    // Check if mouse is now over another polygon
                                    let hoveredLayer = null;
                                    
                                    // Only reset if mouse is not over any polygon
                                    if (!hoveredLayer) {
                                        layer.setStyle(invisibleStyle);
                                        layer.closePopup();
                                        currentActiveLayer = null;
                                    }
                                }
                            }, 30);
                        });
                        
                        // Keep polygon active while mouse moves inside
                        layer.on('mousemove', function(e) {
                            if (currentActiveLayer === layer) {
                                layer.setStyle(hoverStyle);
                            }
                        });
                    }
                }).addTo(map);
                
                // Reset when mouse leaves map
                map.on('mouseout', function() {
                    if (currentActiveLayer) {
                        currentActiveLayer.setStyle(invisibleStyle);
                        currentActiveLayer.closePopup();
                        currentActiveLayer = null;
                    }
                });
                
                console.log("✅ POPUP FIXED - Now mouse can go through to other polygons!");
            })
            .catch(error => {
                console.error('❌ Error:', error);
                alert('Error: data.geojson file not found!');
            });
    </script>
</body>

</html>
