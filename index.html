<!DOCTYPE html>
<html>

<head>
    <title>Full Screen Image with Polygons - Live Google Sheet Data</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }

        /* Aesthetic Popup Styling - FIXED to not block mouse */
        .custom-popup .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg, #ffffff 0%, #2a5298 100%);
            color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            padding: 0;
            pointer-events: none;
        }
        
        .custom-popup .leaflet-popup-close-button {
            pointer-events: auto;
            cursor: pointer;
        }

        .custom-popup .leaflet-popup-content {
            margin: 0;
            padding: 15px 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-width: 220px;
            pointer-events: none;
        }
        
        .custom-popup {
            pointer-events: none !important;
        }
        
        .custom-popup .leaflet-popup-close-button {
            pointer-events: auto !important;
            z-index: 1000;
        }

        .popup-logo {
            display: block;
            margin: 0 auto 10px auto;
            text-align: center;
        }

        .popup-logo img {
            max-width: 300px;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .popup-row {
            display: flex;
            margin: 8px 0;
        }

        .popup-label {
            font-weight: bold;
            width: 70px;
            color: #000000;
        }

        .popup-value {
            flex: 1;
            color: #000000;
        }

        .popup-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // Image dimensions
        const IMG_WIDTH = 4289;
        const IMG_HEIGHT = 2250;

        // Logo URL
        const LOGO_URL = "https://static1.squarespace.com/static/646683f1b3ddb256f7b1085f/t/68c314352bdf2d375a2d30f3/1736807703780/";

        // Google Sheet ID
        const SHEET_ID = '1Bz-0pbQlnr2Cj1xYB3Ur37HzNOAAhk1pr5IL8GTg2rE';
        
        // Global variables
        let map;
        let geoJsonLayer = null;
        let currentActiveLayer = null;
        let sheetDataMap = new Map();
        let isRefreshing = false;
        
        // Create map with Simple CRS
        map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1.5,
            maxZoom: 8,
            zoomSnap: 0.5,
            zoomDelta: 0.5,
            attributionControl: false
        });

        // Image bounds
        var bounds = [[0, 0], [IMG_HEIGHT, IMG_WIDTH]];

        // Add image overlay
        L.imageOverlay('map.jpg', bounds, {
            opacity: 1,
            interactive: true
        }).addTo(map);

        // Force full image visible
        var centerX = IMG_WIDTH / 2;
        var centerY = IMG_HEIGHT / 2;
        map.setView([centerY, centerX], -1.5);
        map.setMaxBounds(bounds);

        // Transformation function
        function transformGeoJSONtoLeaflet(x, y) {
            let newX = x;
            let distanceFromBottom = Math.abs(y);
            let newY = IMG_HEIGHT - distanceFromBottom;
            return [newX, newY];
        }

        // Function to create popup content from properties
        function createPopupContent(props) {
            let blockName = props.BLOCKS || props.block || props.Block || `Block ${props.OBJECTID || ''}`;

            let html = `
                <div class="popup-logo">
                    <img src="${LOGO_URL}" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div class="popup-row">
                    <span class="popup-label">BLOCK:</span>
                    <span class="popup-value">${blockName}</span>
                </div>
            `;

            if (props.LOT || props.Lot || props.lot) {
                let lotVal = props.LOT || props.Lot || props.lot;
                html += `<div class="popup-row"><span class="popup-label">LOT:</span><span class="popup-value">${lotVal}</span></div>`;
            }

            if (props.AREA || props.Area || props.area) {
                let areaVal = props.AREA || props.Area || props.area;
                areaVal = String(areaVal).replace(/,/g, '');
                if(!isNaN(areaVal)) {
                    areaVal = parseFloat(areaVal).toLocaleString();
                }
                html += `<div class="popup-row"><span class="popup-label">AREA(SF):</span><span class="popup-value">${areaVal}</span></div>`;
            }

            if (props.PRICE || props.Price || props.price) {
                let priceVal = props.PRICE || props.Price || props.price;
                html += `<div class="popup-row"><span class="popup-label">PRICE:</span><span class="popup-value">${priceVal}</span></div>`;
            }

            let builderVal = props.BUILDER || props.Builder || props.builder;
            if (builderVal && builderVal.toString().trim() !== '') {
                html += `<div class="popup-divider"></div>`;
                html += `<div class="popup-row"><span class="popup-label">BUILDER:</span><span class="popup-value"> ${builderVal}</span></div>`;
            }

            return html;
        }

        // Function to fetch data from Google Sheet
        async function fetchGoogleSheetData() {
            try {
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
                
                console.log('Fetching from:', csvUrl);
                const response = await fetch(csvUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const csvText = await response.text();
                
                // Parse CSV
                const rows = csvText.split('\n');
                if (rows.length < 2) {
                    throw new Error('Sheet is empty');
                }
                
                const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim().toUpperCase());
                
                // Find column indices
                const lotIndex = headers.findIndex(h => h.includes('LOT'));
                const areaIndex = headers.findIndex(h => h.includes('AREA'));
                const priceIndex = headers.findIndex(h => h.includes('PRICE'));
                const builderIndex = headers.findIndex(h => h.includes('BUILDER'));
                const blocksIndex = headers.findIndex(h => h.includes('BLOCKS'));
                
                const newSheetMap = new Map();
                let validRows = 0;
                
                // Parse each row
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue;
                    
                    // Parse CSV line
                    let values = [];
                    let inQuote = false;
                    let currentValue = '';
                    
                    for (let char of rows[i]) {
                        if (char === '"') {
                            inQuote = !inQuote;
                        } else if (char === ',' && !inQuote) {
                            values.push(currentValue.trim());
                            currentValue = '';
                        } else {
                            currentValue += char;
                        }
                    }
                    values.push(currentValue.trim());
                    
                    // Clean values
                    values = values.map(v => v.replace(/^"|"$/g, '').trim());
                    
                    const lot = lotIndex >= 0 ? values[lotIndex] : '';
                    const blocks = blocksIndex >= 0 ? values[blocksIndex] : '';
                    const area = areaIndex >= 0 ? values[areaIndex] : '';
                    let price = priceIndex >= 0 ? values[priceIndex] : '';
                    const builder = builderIndex >= 0 ? values[builderIndex] : '';
                    
                    if (lot && blocks) {
                        const key = `${blocks}_${lot}`;
                        newSheetMap.set(key, {
                            LOT: lot,
                            BLOCKS: blocks,
                            AREA: area,
                            PRICE: price,
                            BUILDER: builder
                        });
                        validRows++;
                        console.log(`Added: Block ${blocks}, Lot ${lot} -> Price: ${price}`);
                    }
                }
                
                console.log(`✅ Loaded ${validRows} rows from sheet`);
                return newSheetMap;
                
            } catch (error) {
                console.error('Sheet fetch error:', error);
                return null;
            }
        }
        
        // Update polygons with sheet data - FIXED: No glitch
        function updatePolygonsWithSheetData(sheetMap) {
            if (!geoJsonLayer || isRefreshing) {
                return false;
            }
            
            isRefreshing = true;
            let updatedCount = 0;
            
            try {
                geoJsonLayer.eachLayer(layer => {
                    const props = layer.feature.properties;
                    const block = props.BLOCKS || props.block || props.Block;
                    const lot = props.LOT || props.Lot || props.lot;
                    
                    if (block && lot) {
                        const key = `${block}_${lot}`;
                        const sheetData = sheetMap.get(key);
                        
                        if (sheetData) {
                            // Update properties
                            if (sheetData.AREA && sheetData.AREA !== '') {
                                props.AREA = sheetData.AREA;
                            }
                            if (sheetData.PRICE && sheetData.PRICE !== '') {
                                props.PRICE = sheetData.PRICE;
                            }
                            if (sheetData.BUILDER && sheetData.BUILDER !== '') {
                                props.BUILDER = sheetData.BUILDER;
                            }
                            
                            updatedCount++;
                            
                            // FIXED: Smooth popup update without glitch
                            const wasActive = (currentActiveLayer === layer);
                            const wasOpen = layer.isPopupOpen();
                            
                            // Update popup content smoothly
                            if (wasActive || wasOpen) {
                                const wasOpenState = wasOpen;
                                if (wasOpenState) {
                                    layer.closePopup();
                                }
                                
                                layer.bindPopup(createPopupContent(props), {
                                    className: 'custom-popup',
                                    closeButton: true,
                                    autoClose: false,
                                    closeOnClick: false,
                                    offset: [0, -20]
                                });
                                
                                if (wasOpenState) {
                                    setTimeout(() => {
                                        if (currentActiveLayer === layer) {
                                            layer.openPopup();
                                        }
                                    }, 50);
                                }
                            } else {
                                layer.bindPopup(createPopupContent(props), {
                                    className: 'custom-popup',
                                    closeButton: true,
                                    autoClose: false,
                                    closeOnClick: false,
                                    offset: [0, -20]
                                });
                            }
                        }
                    }
                });
                
                console.log(`✅ Updated ${updatedCount} polygons with sheet data`);
            } finally {
                setTimeout(() => {
                    isRefreshing = false;
                }, 100);
            }
            
            return true;
        }
        
        // Auto refresh function - FIXED: Skip when popup is active
        async function autoRefreshData() {
            // Skip refresh if a popup is currently active or refresh in progress
            if (currentActiveLayer || isRefreshing) {
                console.log('⏸️ Auto-refresh skipped - popup active or refresh in progress');
                return;
            }
            
            console.log('🔄 Auto-refreshing data from sheet...');
            const sheetMap = await fetchGoogleSheetData();
            if (sheetMap && sheetMap.size > 0) {
                sheetDataMap = sheetMap;
                updatePolygonsWithSheetData(sheetDataMap);
            }
        }
        
        // Load GeoJSON first, then fetch sheet data
        async function initMap() {
            try {
                const response = await fetch('data.geojson');
                if (!response.ok) {
                    throw new Error('data.geojson not found!');
                }
                
                const geojson = await response.json();
                console.log("✅ GeoJSON loaded");
                
                // Transform coordinates
                geojson.features.forEach(feature => {
                    if (feature.geometry) {
                        if (feature.geometry.type === 'Polygon') {
                            feature.geometry.coordinates = feature.geometry.coordinates.map(ring => {
                                return ring.map(coord => {
                                    return transformGeoJSONtoLeaflet(coord[0], coord[1]);
                                });
                            });
                        } else if (feature.geometry.type === 'MultiPolygon') {
                            feature.geometry.coordinates = feature.geometry.coordinates.map(polygon => {
                                return polygon.map(ring => {
                                    return ring.map(coord => {
                                        return transformGeoJSONtoLeaflet(coord[0], coord[1]);
                                    });
                                });
                            });
                        }
                    }
                });
                
                // Styles
                const invisibleStyle = {
                    color: 'transparent',
                    weight: 0,
                    fillColor: 'transparent',
                    fillOpacity: 0,
                    opacity: 0
                };
                
                const hoverStyle = {
                    color: '#ff0000',
                    weight: 3,
                    fillColor: '#ffaa44',
                    fillOpacity: 0.5,
                    opacity: 1
                };
                
                // Add polygons to map
                geoJsonLayer = L.geoJSON(geojson, {
                    style: invisibleStyle,
                    interactive: true,
                    onEachFeature: function (feature, layer) {
                        let popupContent = createPopupContent(feature.properties);
                        
                        layer.bindPopup(popupContent, {
                            className: 'custom-popup',
                            closeButton: true,
                            autoClose: false,
                            closeOnClick: false,
                            offset: [0, -20]
                        });
                        
                        layer.on('mouseover', function(e) {
                            L.DomEvent.stopPropagation(e);
                            if (currentActiveLayer === layer) return;
                            
                            if (currentActiveLayer) {
                                currentActiveLayer.setStyle(invisibleStyle);
                                currentActiveLayer.closePopup();
                            }
                            
                            currentActiveLayer = layer;
                            layer.setStyle(hoverStyle);
                            layer.bringToFront();
                            layer.openPopup();
                        });
                        
                        layer.on('mouseout', function(e) {
                            setTimeout(() => {
                                if (currentActiveLayer === layer) {
                                    layer.setStyle(invisibleStyle);
                                    layer.closePopup();
                                    currentActiveLayer = null;
                                }
                            }, 30);
                        });
                        
                        layer.on('mousemove', function(e) {
                            if (currentActiveLayer === layer) {
                                layer.setStyle(hoverStyle);
                            }
                        });
                    }
                }).addTo(map);
                
                map.on('mouseout', function() {
                    if (currentActiveLayer) {
                        currentActiveLayer.setStyle(invisibleStyle);
                        currentActiveLayer.closePopup();
                        currentActiveLayer = null;
                    }
                });
                
                console.log("✅ Polygons added to map");
                
                // Now fetch Google Sheet data and update polygons
                const sheetMap = await fetchGoogleSheetData();
                if (sheetMap && sheetMap.size > 0) {
                    sheetDataMap = sheetMap;
                    updatePolygonsWithSheetData(sheetDataMap);
                }
                
                // Auto-refresh every 30 seconds - FIXED: No glitch
                setInterval(async () => {
                    await autoRefreshData();
                }, 30000);
                
            } catch (error) {
                console.error('❌ Error:', error);
                alert('Error loading data. Check console.');
            }
        }
        
        // Start the app
        initMap();
    </script>
</body>

</html>
